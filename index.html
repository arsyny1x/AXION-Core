<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/axion-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXION Core — Lua SDK Central Management</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #04060d; color: #e8ecff; font-family: "Segoe UI", system-ui, sans-serif; }
      .boot-screen { display: grid; width: 100%; height: 100%; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, rgba(99, 102, 241, .16), transparent 42%), #04060d; }
      .boot-content { display: flex; width: min(320px, calc(100vw - 40px)); flex-direction: column; align-items: center; gap: 12px; text-align: center; }
      .boot-content img { width: 112px; height: 112px; border-radius: 25px; object-fit: cover; box-shadow: 0 0 44px rgba(99, 102, 241, .26); }
      .boot-content h1 { margin: 8px 0 0; font-size: 22px; letter-spacing: .4px; }
      .boot-content p { margin: 0; color: #9ba5c7; font-size: 12px; }
      .boot-progress { width: 180px; height: 3px; margin-top: 5px; overflow: hidden; border-radius: 99px; background: rgba(148, 163, 184, .16); }
      .boot-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ed5ab5, #4dd4ed); }
      .boot-percent { color: #9ba5c7; font-size: 11px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-live="polite">
        <div class="boot-content">
          <img src="/axion-app-icon.png" alt="" />
          <h1>AXION Core</h1>
          <p>Preparing application...</p>
          <div class="boot-progress" role="progressbar" aria-label="Application startup" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
          <span class="boot-percent">0%</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
